name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests-and-lint:
    name: Pure Python Tests & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest pyright

    - name: Run Pytest suite
      run: |
        python -m pytest -v

    - name: Run Pyright Type Checking
      run: |
        pyright

    - name: Validate blender_manifest.toml existence
      run: |
        test -f blender_manifest.toml

  blender-integration:
    name: Headless Blender Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        blender-version: ["4.0.2", "4.2.0"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Blender ${{ matrix.blender-version }}
      uses: blender-actions/setup-blender@v3
      with:
        blender-version: ${{ matrix.blender-version }}

    - name: Run Headless Blender Integration Test
      run: |
        blender --background --python tests/test_blender_addon.py
