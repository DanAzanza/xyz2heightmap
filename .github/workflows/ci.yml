name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests-and-lint:
    name: Pure Python Tests & Linting (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run CI Verification Gate (Ruff, Pyright, Pytest with Coverage)
      run: |
        python scripts/verify_ci.py --skip-blender

    - name: Validate blender_manifest.toml existence
      run: |
        test -f blender_manifest.toml

  blender-integration:
    name: Headless Blender Integration Test (${{ matrix.blender-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        blender-version: ["5.0.1", "5.2.1"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install System Dependencies for Headless Blender
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libglu1-mesa libxi6 libxcursor1 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 libxext6

    - name: Cache Portable Blender
      id: cache-blender
      uses: actions/cache@v5
      with:
        path: /opt/blender
        key: ${{ runner.os }}-blender-${{ matrix.blender-version }}-linux-x64-v1

    - name: Download & Extract Blender ${{ matrix.blender-version }}
      if: steps.cache-blender.outputs.cache-hit != 'true'
      run: |
        set -e
        BLENDER_VERSION="${{ matrix.blender-version }}"
        BLENDER_URL="https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
        sudo mkdir -p /opt/blender
        sudo chown -R $USER:$USER /opt/blender
        curl -fSL --retry 3 --retry-delay 5 "$BLENDER_URL" -o /tmp/blender.tar.xz
        tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
        rm -f /tmp/blender.tar.xz

    - name: Verify Blender Binary & Permissions
      run: |
        chmod +x /opt/blender/blender
        sudo ln -sf /opt/blender/blender /usr/local/bin/blender
        blender --version

    - name: Run Headless Blender Integration Test
      run: |
        blender --background --factory-startup --python-exit-code 1 --python tests/test_blender_addon.py
