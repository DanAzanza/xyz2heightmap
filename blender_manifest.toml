schema_version = "1.0.0"
id = "xyz_pointcloud_importer"
version = "2.2.0"
name = "XYZ Point Cloud Importer"
tagline = "Import XYZ point clouds as heightmaps or 3D terrain meshes"
maintainer = "Daniel Azanza Hartmann"
type = "add-on"

blender_version_min = "4.0.0"
license = ["GPL-3.0-or-later"]
tags = ["Import-Export", "3D View"]
website = "https://github.com/DanAzanza/xyz2heightmap"

[permissions]
files = "Import XYZ point clouds and export 16-bit PNG heightmaps"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.*",
    "/tests/",
    "/pyproject.toml",
    "/CONTRIBUTING.md",
]

